# ~/.config/starship.toml
########################################
#prompt global settings
########################################

add_newline = false
command_timeout = 1000
format = "$all"

# Voltage — this repo's own palette: warm near-black, electric magenta/lime
# accents. Named colors below resolve through [palettes.voltage] at the bottom
# of this file, so re-theming the whole prompt is a one-line change to this key
# and no module config needs touching. The rest of the shell is on the same
# palette: the terminal itself (.config/ghostty/config), LS_COLORS (vivid),
# fzf, bat + delta and fast-syntax-highlighting — so completions, file
# listings, previews and diffs all agree on the same six hues.
# See themes/voltage.md.
palette = "voltage"

[character]
# Three-symbol gradient — was hardcoded Dracula hex, now the Mocha equivalents.
success_symbol = "[❯](orange)[❯](magenta)[❯](green)"
error_symbol = "[❯](red)[❯](red)[❯](red)"
vicmd_symbol = "[N](magenta)"

[battery]
charging_symbol = "⚡️ "
disabled = false
discharging_symbol = "💀 "
full_symbol = "🔋 "

[git_status]
disabled=true

[shell]
#zsh_indicator = "🦾 "
bash_indicator = "🐚 "
disabled = false
powershell_indicator = "_"

[[battery.display]] # red style when capacity is between 0% and 10%
style = "bold red"
threshold = 10

[[battery.display]] # orange style when capacity is between 10% and 40%
style = "bold orange"
threshold = 40

[hostname]
disabled = false
format = "@[$hostname]($style)"
ssh_only = true
style = "bold cyan"

[username]
disabled = false
format = " [$user]($style) "
show_always = true
style_root = "bold red"
style_user = "bold blue"

[php]
disabled = false
style = "bold magenta"
format = "[$symbol($version )]($style)"
symbol = " "

[nodejs]
disabled = false
format = "[$symbol($version )]($style)"
style = "bold green"

# Language/tool modules. Each gets its own palette entry rather than starship's
# defaults, so the colour alone tells you which runtime is in play.
[python]
style = "bold yellow"

[rust]
style = "bold orange"

[golang]
style = "bold cyan"

[ruby]
style = "bold red"

[lua]
style = "bold blue"

[docker_context]
style = "bold blue"

[git_branch]
style = "bold magenta"

[git_state]
style = "bold magenta"

[cmd_duration]
style = "bold yellow"

# `swift --version` takes ~1s on macOS, well past command_timeout
[swift]
disabled = true

[package]
disabled = false
style = "bold orange"

[directory]
home_symbol = "~"
read_only = "🔒 "
style = "bold yellow"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = ""

[memory_usage]
disabled = true
format = "[${symbol}RAM: ${ram}]($style) "
style = "dimmed cyan"
threshold = -1

[jobs]
style = "bold magenta"
format = "[$symbol $number]($style) "
symbol = "🏃️ "
threshold = 4

[terraform]
disabled = true

[time]
disabled = true
format = "[$symbol][$time ]($style) "
style = "bold cyan"
symbol = "🕙 "
use_12hr = false
#time_format = "%Y/%m/%d %T"
time_range = "-" # always: time_range="00:00:00-23:59:59"

[custom.giturl]
command = """
GIT_REMOTE=$(command git config --get remote.origin.url 2>/dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=""
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=""
else
    GIT_REMOTE_SYMBOL=""
fi
echo "$GIT_REMOTE_SYMBOL "
"""
description = "Display symbol for remote Git server"
disabled = false
style = "bold blue"
format = "[$output]($style) "
shell = ["bash", "--noprofile", "--norc"]
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'

########################################
# Palette — Voltage
########################################
# Selected by `palette = "voltage"` at the top; every `style` above refers to
# these names. The first six are the theme's ANSI colors 1-6, verbatim.
# `orange` is NOT an ANSI slot — it is a derived accent, because the palette has
# no warm mid-tone and several modules needed to stay distinct from both red and
# yellow. `fg`/`subtle`/`bg` are the theme's UI tones.
#
# Canonical values live in themes/voltage.md; edit there and mirror here.
[palettes.voltage]
red = "#ff4d5e"
green = "#b3e053"
yellow = "#fcf58d"
blue = "#5cc9f5"
magenta = "#eb43f4"
cyan = "#17d5df"
orange = "#ff9a4d"
fg = "#e7e7e7"
subtle = "#6b6b6b"
bg = "#0f0d0e"
