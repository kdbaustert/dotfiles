# Matches .config/lvim/.stylua.toml and .config/voltage.nvim/.stylua.toml, so
# every Lua file in this repo is formatted the same way regardless of which
# editor saved it. conform.nvim runs stylua on save (lua/plugins/format.lua)
# and stylua walks up from the file being formatted, so this covers the tree.
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
no_call_parentheses = true
