# clamd.conf — ClamAV scanning daemon (Homebrew, Apple Silicon)

DatabaseDirectory /opt/homebrew/var/lib/clamav
LogFile /opt/homebrew/var/log/clamav/clamd.log
LogFileMaxSize 2M
LogTime yes
PidFile /opt/homebrew/var/run/clamav/clamd.pid

# Unix socket only — no network listener
LocalSocket /opt/homebrew/var/run/clamav/clamd.sock
LocalSocketMode 660

# Let clamdscan hand off file descriptors so the daemon can scan
# files it wouldn't otherwise have permission to open
FixStaleSocket yes

User kenny

MaxThreads 12
MaxDirectoryRecursion 20
# Raised from the 100M/400M/10000 defaults so ordinary dev artifacts actually
# get scanned instead of being reported as skipped — a 134M theme zip and a
# vnu.jar holding 14,937 entries both tripped the stock limits.
# Deliberately not raised further: ~/Development has a 1.8GB git pack, and
# chasing that would mean minutes of CPU to scan a compressed object store
# that can't execute anything. It stays reported as skipped, which is honest.
MaxFileSize 250M
MaxScanSize 1000M
MaxFiles 20000

# Archive / document scanning
ScanArchive yes
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanMail yes
ScanSWF yes

# Heuristics
HeuristicAlerts yes
AlertBrokenExecutables yes
AlertEncrypted no

# Keep the daemon idle-friendly
IdleTimeout 30

# Reload signatures in place instead of building a second copy of the whole
# database alongside the live one. Default (yes) doubles peak RSS — ~1.3GB
# becomes ~2.6GB every time freshclam updates. Cost is that scans block for
# a few seconds during the reload, which is irrelevant for on-demand use.
ConcurrentDatabaseReload no

# Report files skipped for exceeding MaxFileSize/MaxScanSize/MaxRecursion.
# Off by default, which means oversized files are silently left unscanned
# and the scan still reports "OK" — actively misleading.
AlertExceedsMax yes

# Cap time spent on any single file (5 min). Disabled by default, so a
# malformed or deliberately crafted archive can occupy a thread forever.
MaxScanTime 300000

# Rotate logs rather than letting them stop at LogFileMaxSize
LogRotate yes

# Die rather than get OOM-killed halfway through, which leaves a stale socket
ExitOnOOM yes

# Detect Potentially Unwanted Applications — adware and bundleware, which is
# the realistic macOS threat. ClamAV's core signatures skew Windows/email.
DetectPUA yes

# Allowlist rather than blocklist. The categories below were taken from the
# installed daily.cvd, not from clamd.conf.sample — the sample's examples
# (NetTool, PWTool, RAT, Scanner) no longer exist in the database at all.
#
# Omitted on purpose, all of which fire constantly on a dev machine:
#   Packed  — UPX/obfuscated binaries; matches plenty of legit Go/Rust builds
#   Tool    — admin and security tooling
#   Js/Html — every node_modules tree lights up
#   Php     — flags ordinary framework code (rfxn's DB already proved this
#             against ~/Development/cnc-claims)
#   Doc/Pdf — any PDF carrying JavaScript or form actions
IncludePUA Osx
IncludePUA Unix
IncludePUA Spy
IncludePUA Andr
IncludePUA Win
