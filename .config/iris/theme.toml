# ~/.config/iris/theme.toml — Voltage (themes/voltage.md).
#
# iris draws an overlay menu over the prompt, so it sits directly next to fzf,
# fzf-tab and atuin and has to agree with them. The roles below are mapped from
# the tools that already own the same job:
#
#   selection accent  magenta — fzf `hl`, atuin `Important`, lazygit's active
#                     border. Reserved here for "current/selected" and used for
#                     nothing else, which is why the tag pills below avoid it.
#   borders/muted     #6b6b6b — fzf `border`, lazygit's inactive border, the
#                     palette's `subtle`.
#   metadata          cyan — fzf `header`/`spinner`, atuin `Annotation`, the
#                     `da` slot in EZA_COLORS.
#   keybinding hints  blue — lazygit `optionsTextColor`.
#
# iris falls back to its own default for any key that is missing, so this file
# sets every one rather than relying on partial overrides.

# Overlay border. Subtle, so the frame recedes instead of competing with the
# prompt it is drawn over — same value fzf uses for its own border.
border = "#6b6b6b"

# Selected marker and icon. The palette's `accent` (bright magenta), which
# voltage.md already defines as the cursor color — this is the cursor of the
# menu, and it matches fzf's hl+ on the focused row.
accent = "#f712ff"

# Unselected icons. `subtle`, the same grey as the border.
muted = "#6b6b6b"

# Body text: `fg`, i.e. fzf's fg and the ANSI 7 everything else writes in.
text = "#e7e7e7"

# Selected row text: `white`, matching fzf's fg+.
text_sel = "#f8f8f8"

# Footer shortcut keys. Blue is the keybinding-hint color lazygit uses for the
# same strip along the bottom of its panels.
key = "#5cc9f5"

# Matched substring — fzf's `hl` exactly, so a match highlights the same way in
# the menu as it does in every picker.
match = "#eb43f4"

# Descriptions (the spec text beside each suggestion). Held at `subtle` so a
# long description can't out-shout the suggestion itself, and lifted to `fg` on
# the selected row where it's the one you're actually reading.
desc = "#6b6b6b"
desc_sel = "#e7e7e7"

# Selected row fill — fzf's bg+ and lazygit's selectedLineBgColor. `sel` rather
# than `bg-alt`: bg-alt is too dark to read as a highlight against ghostty's
# blurred, 75%-opacity background.
sel_bg = "#2a2427"

# Text printed *on* a selected tag pill, i.e. on one of the vivid backgrounds
# below. `bg` — the same near-black lazygit puts on its cherry-picked and marked
# commits for the identical foreground-on-accent case.
sel_text = "#0f0d0e"

# Scroll counter. Metadata, so cyan with the rest of it.
scroll_info = "#17d5df"

# Inline ghost text. `ghost-text = false` in config.toml (zsh-autosuggestions
# keeps that job), so this is currently inert — set to the exact value of
# $ZSH_AUTOSUGGEST_HIGHLIGHT_STYLE in .zshrc so that flipping it on doesn't
# introduce a second, differently-colored ghost.
ghost_text = "#6b6b6b"

#------------------------------------------------------------------------------
# Category tag pills
#------------------------------------------------------------------------------
# Three tags have to stay tellable apart at a glance, so they take three widely
# separated hues — and none of them magenta, which is reserved for selection:
#
#   sys    green  — what fast-syntax-highlighting already paints a command,
#                   builtin or function (.config/fsh/voltage.ini)
#   hist   cyan   — history is atuin's, and cyan is atuin's Annotation
#   alias  orange — the palette's designated warm extra, which voltage.md keeps
#                   precisely for cases like this one, where a third color has
#                   to read as neither of the other two. (fsh paints aliases
#                   green, same as commands, so it can't disambiguate here.)
#
# The unselected backgrounds are the only derived values in this file: each is
# its family color mixed 20% into `bg` (#0f0d0e), which is the same weight
# iris's own defaults use. They are dark tints, not palette entries — if the
# palette changes, recompute them rather than looking them up.
sys = "#30371c"
sys_sel = "#b3e053"
hist = "#113538"
hist_sel = "#17d5df"
alias = "#3f291b"
alias_sel = "#ff9a4d"
