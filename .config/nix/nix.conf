# Nix's user-level config, read on top of /etc/nix/nix.conf — which the
# installer leaves at the bare `build-users-group` line — and deployed to
# ~/.config/nix by the .config/* loop in install.sh.
#
# Flakes and the unified `nix` command are still gated behind this flag in the
# upstream 2.35 install. Both checkouts under ~/Developer that ship a dev shell
# (ghostty, rio) are flakes — their .envrc says `use flake` — so without this
# line direnv errors on every cd into them, and `nix config show` itself
# refuses to run. kennybdev's flake is ours and needs the same.
experimental-features = nix-command flakes
