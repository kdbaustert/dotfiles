# freshclam.conf — ClamAV signature updater (Homebrew, Apple Silicon)

DatabaseDirectory /opt/homebrew/var/lib/clamav
UpdateLogFile /opt/homebrew/var/log/clamav/freshclam.log
LogFileMaxSize 2M
LogTime yes
LogRotate yes

# Verify each downloaded database loads before swapping it in
TestDatabases yes

# Incremental .cdiff updates instead of re-pulling the full ~120MB set
ScriptedUpdates yes

#------------------------------------------------------------------------------
# Third-party signatures
#------------------------------------------------------------------------------
# ClamAV's own signatures skew heavily Windows/email, so these fill the gap.
# Every one below was false-positive tested against ~/Development (4.4GB) and
# ~/Downloads (100,934 files / 7.71GiB) before being added: zero hits.
#
# Sane Security's terms: "The mirrors reserve the right to block your IP
# address if you are downloading too many times per hour." Their signatures
# publish hourly and the LaunchAgent checks every 2h (12/day), which is well
# inside that. Do NOT lower StartInterval in the plist without re-reading
# https://www.sanesecurity.com/usage/ first.
#
# ftp.sanesecurity.net does not resolve; rollernet is a listed mirror.

# Malicious URLs (abuse.ch) — ~16.7k signatures
DatabaseCustomURL https://urlhaus.abuse.ch/downloads/urlhaus.ndb

# Malware hashes (Sane Security) — ~1k signatures, hash-based so near-zero FP
DatabaseCustomURL http://mirror.rollernet.us/sanesecurity/malwarehash.hsb

# Rogue/fake antivirus (Sane Security) — ~800 signatures
DatabaseCustomURL http://mirror.rollernet.us/sanesecurity/rogue.hdb

# Deliberately NOT included:
#   rfxn.ndb (Linux Malware Detect) — flagged App/Core/App.php in BOTH
#     cnc-claims and cnc-claimsource as php.inject.v23au.578. Verified false
#     positive: no eval/base64_decode/superglobal patterns, git-tracked with
#     ordinary history. It matches generic PHP framework idiom, so it will
#     keep firing on your own code.
#   winnow_malware.hdb (Sane Security) — 65 bytes, 0 signatures. Dead file.

DatabaseOwner kenny

DatabaseMirror database.clamav.net

# Tell the running clamd to reload signatures after every successful update —
# without this the daemon keeps serving whatever it loaded at startup.
NotifyClamd /opt/homebrew/etc/clamav/clamd.conf

# Inert here: Checks only applies to freshclam's own daemon mode (-d), which we
# deliberately don't use — launchd drives the schedule via StartInterval in
# com.clamav.freshclam.plist instead. Kept only so the intended cadence (12/day,
# matching the plist's 7200s) is recorded in one place. Change the plist, not this.
Checks 12

# Attempts per mirror before giving up
MaxAttempts 3

# Optional signature sets
Bytecode yes

# Fail fast instead of hanging on a dead mirror
ConnectTimeout 30
ReceiveTimeout 60
