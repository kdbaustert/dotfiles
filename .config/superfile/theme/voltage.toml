# Voltage for superfile (spf). Canonical hex values and the list of every file
# that copies them are in themes/voltage.md; change them there first.
#
# Every value below is one Ghostty already draws: its background, foreground,
# cursor, selection background or a palette slot in .config/ghostty/config.
# Nothing comes from voltage.md's extras (bg-alt, orange), so spf can't show a
# color the terminal around it never does.
#
# The role choices follow .config/yazi/theme.toml, so the two file managers
# look alike: magenta for focused borders, cyan for the current path, blue for
# directories, `sel` (#2A2427) behind the selected row.
#
# This file is linked on its own rather than through the theme/ directory.
# superfile rewrites every built-in theme into ~/.config/superfile/theme each
# time its version changes, so a linked directory would dump 21 stock themes
# into the repo on the first upgrade.
#
# A theme that fails to parse doesn't error: superfile logs it and falls back
# to catppuccin-mocha. If spf comes up purple and pastel, check
# ~/.local/state/superfile/superfile.log.

# Chroma has no Voltage style. monokai is the closest stock one: pink keywords,
# lime functions, yellow strings and cyan types line up with Voltage's magenta,
# green, yellow and cyan. Set code_previewer = "bat" in config.toml to get the
# real Voltage.tmTheme instead.
code_syntax_highlight = "monokai"

#-- Full Screen
full_screen_fg = "#E7E7E7"
full_screen_bg = "#0F0D0E"

#-- Gradient
# Two colors only. Magenta into blue stays bright all the way across; magenta
# into lime passes through a muddy beige halfway.
gradient_color = ["#EB43F4", "#5CC9F5"]
directory_icon_color = "#5CC9F5"

#-- File Panel
file_panel_fg = "#E7E7E7"
file_panel_bg = "#0F0D0E"
file_panel_border = "#6B6B6B"
file_panel_border_active = "#EB43F4"
file_panel_top_directory_icon = "#B3E053"
file_panel_top_path = "#17D5DF"
file_panel_item_selected_fg = "#F712FF"
file_panel_item_selected_bg = "#2A2427"

#-- Footer
footer_fg = "#E7E7E7"
footer_bg = "#0F0D0E"
footer_border = "#6B6B6B"
footer_border_active = "#EB43F4"

#-- Sidebar
sidebar_fg = "#E7E7E7"
sidebar_bg = "#0F0D0E"
sidebar_title = "#17D5DF"
sidebar_border = "#6B6B6B"
sidebar_border_active = "#EB43F4"
sidebar_item_selected_fg = "#F712FF"
sidebar_item_selected_bg = "#2A2427"
sidebar_divider = "#393A3D"

#-- Modals
# Ghostty's selection background rather than bg, so a modal reads as a layer
# over the panels.
modal_fg = "#E7E7E7"
modal_bg = "#2A2427"
modal_border_active = "#EB43F4"
modal_cancel_fg = "#0F0D0E"
modal_cancel_bg = "#FF4D5E"
modal_confirm_fg = "#0F0D0E"
modal_confirm_bg = "#B3E053"

#-- Help Menu
help_menu_hotkey = "#17D5DF"
help_menu_title = "#EB43F4"

#-- Special
# cancel is Ghostty's yellow (slot 3) so a cancelled operation doesn't read as
# an error.
cursor = "#F712FF"
correct = "#B3E053"
error = "#FF4D5E"
hint = "#5CC9F5"
cancel = "#FCF58D"
