# Voltage: themes/voltage.md.
#
# glow's `style` takes either a built-in name or a path to a glamour JSON
# style. "auto" (glow's default) picks glamour's stock dark or light set, which
# would leave markdown as the one surface off-palette.
#
# There is no `style` line here on purpose. The path would have to be absolute
# with the home directory spelled out: glow 3.0.0 doesn't expand `~` or $HOME
# in it and resolves a relative path against the current working directory,
# not against this file. The `glow` alias in zsh/aliases.zsh passes voltage.json
# with -s instead, where $HOME can expand.

# mouse support (TUI-mode only)
mouse: false
# use pager to display markdown
pager: false
# word-wrap at width
width: 80
# show all files, including hidden and ignored.
all: false
