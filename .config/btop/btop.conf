#? Config file for btop v. 1.4.7

# Voltage — themes/voltage.md. The theme file is themes/voltage.theme
# alongside this config; install.sh symlinks the whole .config/btop directory,
# and btop looks for user themes under its own config dir, so no other wiring
# is needed. The value is the file stem, not a path.
color_theme = "voltage"

# The theme leaves main_bg empty so the terminal shows through; that only has
# an effect with a transparent background, which Ghostty draws at 75% + blur.
theme_background = False

# The palette is 24-bit (themes/voltage.md is all hex). Letting btop degrade to
# 256 colors would reintroduce exactly the approximation drift that the fzf
# cleanup removed.
truecolor = True
