# ~/.config/iris/config.toml
# iris configuration file

[core]
# schema version
# do not edit this field manually
version = 1

# override shell: "bash", "zsh", "fish", keep empty for auto detection
# pinned rather than auto-detected: `i` is launched from an interactive zsh, and
# pinning keeps the spawned shell on zsh even when $SHELL is odd (cron, ssh, su).
shell = "zsh"

# run the selected shell as a login shell
shell-login = false

# startup mode: "last", "spec", "history"
# "last" = remember last mode used
mode = "last"

# enable debug logging
debug = false

# automatically expand aliases on space
expand-alias = true

# automatically execute command after accepting suggestion
auto-execute = false

[ui]
# visual style: "modern" (icons, category pills, shortcut footer) or "classic" (minimalist, centered number, no icons)
style = "modern"

# enable Nerd Fonts icons in overlay menu
nerd-fonts = true

# show hidden files with dot prefix
# ON: FileGenerator skips any entry starting with "." unless this is set, so
# with it off `cd .conf` never completes ~/.config — and most of what gets
# navigated here (.config, .claude, .local) is dot-prefixed. Costs some noise
# in $HOME (.DS_Store, .Trash), which is worth it to make `cd` usable.
hidden-files = true

# enable inline ghost text
# OFF: zsh-autosuggestions (loaded via zinit) already draws inline grey ghost
# text. Both on means two suggestions overprinting the same cells.
ghost-text = false

# maximum suggestions to display
max-suggestions = 100

# maximum height of the overlay
max-height = 15

# maximum width of the overlay (0 = responsive to terminal)
max-width = 0

[git]
# hide current branch in checkout/switch list
filter-active-branch = true

# merge remote and local branches with same name
deduplicate-branches = true

[updater]
# check for updates on startup
# OFF: the binary is owned by Homebrew (`brew "versenilvis/iris/iris"`), so an
# in-place `iris update` would desync the brew manifest. It also costs a network
# round-trip on every `i`, which is the whole latency budget for an on-demand
# launch. Update with brew instead.
check-on-startup = false

# update channel: "stable", "nightly"
channel = "stable"

# interval between update checks, e.g. "24h", "6h", "30m"
check-interval = "24h"

[keybindings]
# Remapped off IRIS's defaults. IRIS runs as a TTY wrapper around a real zsh, so
# any key it binds is swallowed before zsh's ZLE ever sees it. The defaults
# (ctrl+r / tab / up) each shadow something already bound in .zshrc:
#
#   ctrl+r -> atuin history search   (.zshrc: "atuin owns Ctrl-R / Up")
#   up     -> atuin history          (same)
#   tab    -> fzf-tab completion menu + all the fzf-preview zstyles
#
# Moving IRIS to keys nothing else claims keeps atuin and fzf-tab fully working
# inside an `i` session. Ctrl-O/Y/P/N are stock emacs ZLE bindings that this
# config never rebinds, and IRIS's input handler has no hardcoded behaviour for
# their bytes (0x0f/0x19/0x10/0x0e), so they are free to take.
toggle-mode = "ctrl+o"    # was ctrl+r — spec/history mode switch
toggle-menu = "shift+tab" # unchanged; nothing else binds it
select = "ctrl+y"         # was tab — accept the highlighted suggestion
navigate-up = "ctrl+p"    # was up
navigate-down = "ctrl+n"  # was down
