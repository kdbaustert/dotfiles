; Voltage — fast-syntax-highlighting theme
;
; Written for this dotfiles repo; fast-syntax-highlighting ships no theme that
; matches (see `fast-theme -l`: base16, clean, default, forest, free,
; q-jmnemonic, safari, spa, sv-orple, sv-plant, zdharma).
;
; Colors are stated as 6-digit hex rather than ANSI names or 256 indices.
; fast-theme accepts hex (it matches `#[0-9a-fA-F]{6}` when parsing a style),
; which matters here: the whole point is that these are the *same* values as
; starship, fzf, vivid and bat, and ANSI names would instead resolve to
; whatever the terminal's palette happens to map them to.
;
; Palette: themes/voltage.md.
;
; Apply with:  fast-theme XDG:voltage
; That writes ~/.config/fsh/current_theme.zsh, which the plugin sources on
; every start — so it persists and does not need re-running per shell.

[base]
default          = none
unknown-token    = #ff4d5e,bold
commandseparator = #eb43f4
redirection      = #17d5df
here-string-tri  = #fcf58d
here-string-text = bg:#2a2427
here-string-var  = #17d5df,bg:#2a2427
exec-descriptor  = #fcf58d,bold
comment          = #6b6b6b
correct-subtle   = #b3e053
incorrect-subtle = #ff4d5e
subtle-separator = #b3e053
subtle-bg        = bg:#2a2427
secondary        = free
; Base color for the recursion highlighting inside $(...) / `...`. Left unset,
; fast-theme prints "Missing style: recursive-base" on every apply.
recursive-base   = #e7e7e7

[command-point]
reserved-word     = #eb43f4
subcommand        = #ff9a4d
alias             = #b3e053,bold
suffix-alias      = #b3e053,bold
global-alias      = #b3e053,bold
builtin           = #b3e053
function          = #b3e053,bold
command           = #b3e053,bold
precommand        = #ff9a4d
hashed-command    = #b3e053
single-sq-bracket = #b3e053
double-sq-bracket = #b3e053
double-paren      = #eb43f4

[paths]
path          = #5cc9f5
pathseparator =
path-to-dir   = #5cc9f5,underline
globbing      = #eb43f4,bold
globbing-ext  = #eb43f4

[brackets]
paired-bracket  = bg:#2a2427
bracket-level-1 = #b3e053,bold
bracket-level-2 = #fcf58d,bold
bracket-level-3 = #17d5df,bold

[arguments]
single-hyphen-option   = #17d5df
double-hyphen-option   = #17d5df
back-quoted-argument   = #ff9a4d
single-quoted-argument = #fcf58d
double-quoted-argument = #fcf58d
dollar-quoted-argument = #fcf58d
; An option's argument, as in `--color=always` / `-n 20`. Set explicitly —
; otherwise fast-theme falls back to double-quoted-argument and mathnum, and
; says so on every apply.
optarg-string          = #fcf58d
optarg-number          = #eb43f4

[in-string]
; backslash in $'...'
back-dollar-quoted-argument           = #17d5df
; backslash or $... in "..."
back-or-dollar-double-quoted-argument = #17d5df

[other]
variable             = #ff9a4d
assign               = none
assign-array-bracket = #b3e053
history-expansion    = #5cc9f5,bold

[math]
mathvar = #5cc9f5,bold
mathnum = #eb43f4
matherr = #ff4d5e

[for-loop]
forvar  = #ff9a4d
fornum  = #eb43f4
foroper = #fcf58d
forsep  = #fcf58d,bold

[case]
case-input       = #b3e053
case-parentheses = #fcf58d
case-condition   = bg:#2a2427
