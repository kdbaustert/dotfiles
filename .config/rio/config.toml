# See the full configuration reference: https://rioterm.com/docs/config

# Top-level options must come BEFORE any [section] header, or TOML folds them
# into the preceding table (e.g. colors.margin) and Rio ignores them.
# NOTE: this key is `margin` in 0.4.x (the docs site's `padding` is a newer
# release). Unknown keys are dropped silently, so a typo just does nothing.
margin = [10, 10, 15, 10]  # top, right, bottom, left (CSS order)
line-height = 1.5  # top-level, NOT under [fonts]
confirm-before-quit = false

[colors]
# LunarVim (lunar / TokyoNight Night) theme
# Regular colors
# background = '#1A1B26'
# black = '#15161E'
blue = '#5cc9f5'
# cyan = '#6bc4fa'
# foreground  = '#C0CAF5'
green = '#b3e053'
magenta = '#6638f0'
red = '#eb43f4'
# white = '#A9B1D6'
yellow = '#fcf58d'

# Cursor
# cursor = '#C0CAF5'
vi-cursor = '#6638f0'

# Navigation
# tabs = '#545C7E'  # Inactive tab text and border color
# tabs-active = '#C0CAF5'  # Active tab text color
# bar = '#16161E'
# split = '#292E42'

# Search
# search-match-background = '#3D59A1'
# search-match-foreground = '#C0CAF5'
# search-focused-match-background = '#7AA2F7'
# search-focused-match-foreground = '#15161E'

# Hints
# hint-foreground = '#1A1B26'
# hint-background = '#E0AF68'

# Selection
# selection-foreground = '#C0CAF5'
# selection-background = '#283457'

# Dim colors
# dim-black = '#0C0C14'
dim-blue = '#5cc9f5'
dim-cyan = '#5cc9f5'
# dim-foreground = '#A9B1D6'
# dim-green = '#b3e053'
# dim-magenta = '#9A7FD4'
dim-red = '#eb43f4'
# dim-white = '#9AA5CE'
dim-yellow = '#fcf58d'

# Light colors
# light-black = '#414868'
light-blue = '#5cc9f5'
light-cyan = '#5cc9f5'
# light-foreground = '#C0CAF5'
light-green = '#b3e053'
light-magenta = '#6638f0'
light-red = '#eb43f4'
# light-white = '#C0CAF5'
light-yellow = '#fcf58d'

[fonts]
family = "Hack Nerd Font Mono"
size = 15.5
features = ["calt", "liga", "dlig"]  # enable contextual/standard/discretionary ligatures

# Pin bold faces to regular weight so bold text renders like normal text.
[fonts.bold]
family = "Hack Nerd Font Mono"
weight = 400

[fonts.bold-italic]
family = "Hack Nerd Font Mono"
style = "italic"
weight = 400

[navigation]
mode = "NativeTab"       # macOS native tabs — each tab gets an "×" close button
current-working-directory = true  # new tabs/splits open in the current dir (renamed from use-current-path; reads the shell's cwd via the OS, not OSC 7)

[cursor]
shape = 'underline'
blinking = true

[window]
startup-mode = "Fullscreen"  # open in true fullscreen (own Space, no title bar)
opacity = 0.45
blur = true

[editor]
program = "code"
args = ["--wait"]

[bindings]
keys = [
  { key = "left",  with = "super", action = "SelectPrevTab" },
  { key = "right", with = "super", action = "SelectNextTab" },
]

[renderer]
backend = "Metal"                # GPU backend on macOS (vs Vulkan/GL/DX12/WebGPU)
target-fps = 120                 # cap render rate — match ProMotion (drop to 60 on non-120Hz displays)
disable-unfocused-render = true  # stop rendering windows that aren't focused
disable-occluded-render = true   # stop rendering windows hidden behind others

[bell]
audio = false

[panel]
padding = [10, 20]  # vertical, horizontal (CSS shorthand) — space inside each panel
row-gap = 10  # 10px vertical gap between panels
column-gap = 15  # 15px horizontal gap between panels
border-width = 2.0  # 2px border around panels
border-radius = 8.0  # 8px rounded corners

#[platform]
# macOS: Override only specific fields
#macos.theme = "dracula"
#macos.env-vars = ["HOMEBREW_PREFIX=/opt/homebrew"]
#macos.window.opacity = 1.0  # Other window fields preserved
#macos.shell = { program = "/bin/zsh", args = ["-l"] }
